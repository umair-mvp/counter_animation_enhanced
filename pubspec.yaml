name: counter_animation_enhanced
description: >-
  A rolling-digit counter for Flutter. Numbers count up and down on slot-machine
  wheels with spring motion, digit grouping, decimals and reduce-motion support.
version: 1.0.4
repository: https://github.com/umair-mvp/counter_animation_enhanced
issue_tracker: https://github.com/umair-mvp/counter_animation_enhanced
topics:
  - counter
  - animation
  - numbers
  - odometer
  - formatting

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
